{% extends "base.html" %}

{% block title %}News - Movie Reviews{% endblock %}

{% block content %}
<div class="container py-4 pb-5">
  <h1 class="text-light">News</h1>
  <p class="text-secondary">Latest news, most recent first.</p>

  {% for news in news_items %}
  <div
    class="card mb-3 border-secondary"
    style="max-width: 880px; background-color: #161616"
  >
    <div class="row g-0">
      <div class="col-md-12">
        <div class="card-body">
          <h5 class="card-title text-light">{{ news.headline }}</h5>
          <p class="card-text text-secondary">
            {{ news.body|truncatewords:45 }}
          </p>
          <p class="card-text">
            <small class="text-muted">{{ news.date }}</small>
          </p>
        </div>
      </div>
    </div>
  </div>
  {% empty %}
  <p class="text-secondary">No news yet.</p>
  {% endfor %}
</div>
{% endblock %}
