<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News - Movie Reviews</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body style="background-color: #0b0b0b">
    <nav class="navbar bg-black border-bottom border-secondary">
      <div class="container">
        <span class="navbar-brand mb-0 h1 text-light">Movie Reviews</span>
        <a class="btn btn-outline-light btn-sm" href="/">Home</a>
      </div>
    </nav>

    <div class="container py-4 pb-5">
      <h1 class="text-light">News</h1>
      <p class="text-secondary">Latest news, most recent first.</p>

      <!-- Card horizontal para cada noticia -->
      {% for news in news_items %}
      <div
        class="card mb-3 border-secondary"
        style="max-width: 720px; background-color: #161616"
      >
        <div class="row g-0">
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title text-light">{{ news.headline }}</h5>
              <p class="card-text text-secondary">
                {{ news.body|truncatewords:45 }}
              </p>
              <p class="card-text">
                <small class="text-muted">{{ news.date }}</small>
              </p>
            </div>
          </div>
        </div>
      </div>
      {% empty %}
      <p class="text-secondary">No news yet.</p>
      {% endfor %}
    </div>
  </body>
</html>
