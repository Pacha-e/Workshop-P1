{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Movie Reviews{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        scroll-behavior: auto;
      }

      body {
        background-color: #0b0b0b;
        min-height: 100vh;
      }

      .navbar-brand img {
        height: 34px;
        width: 34px;
        object-fit: contain;
      }
    </style>
  </head>
  <body class="d-flex flex-column">
    <nav class="navbar navbar-expand-lg bg-black border-bottom border-secondary">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 text-light"
          href="{% url 'home' %}"
        >
          <img src="{% static 'images/home.png' %}" alt="Home" />
          <span>Movie Reviews</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'news' %}">News</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'statistics' %}">Statistics</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#login">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Sign Up</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-top border-secondary bg-black py-3">
      <div class="container text-secondary small">
        Proyecto Integrador 1 - Movie Reviews
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
